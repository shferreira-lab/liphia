[module]
name        = "db"
version     = "1.1.0"
description = "Database driver for Liphia — SQLite (embedded, zero dependencies) and PostgreSQL (pure TCP wire protocol)"
native      = true
entry       = "db.lph"
files       = ["db.lph"]

[sqlite]
backend  = "rusqlite"
features = ["bundled"]
note     = "SQLite is compiled into the binary. No system installation required."

[postgresql]
backend = "tcp"
note    = "Pure Rust TCP implementation of the PostgreSQL wire protocol v3. No external crate required. Supports trust and cleartext password authentication."

[functions.sqlite]
db_open        = "db_open(path: str) -> int"
db_open_memory = "db_open_memory() -> int"
db_close       = "db_close(handle: int) -> bool"
db_exec        = "db_exec(handle: int, sql: str) -> int"
db_query       = "db_query(handle: int, sql: str) -> list"
db_query_rows  = "db_query_rows(handle: int, sql: str) -> list"
db_last_id     = "db_last_id(handle: int) -> int"
db_begin       = "db_begin(handle: int) -> bool"
db_commit      = "db_commit(handle: int) -> bool"
db_rollback    = "db_rollback(handle: int) -> bool"
db_error       = "db_error(handle: int) -> str"
db_tables      = "db_tables(handle: int) -> list"
db_columns     = "db_columns(handle: int, table: str) -> list"

[functions.postgresql]
pg_connect    = "pg_connect(host: str, port: int, user: str, pass: str, db: str) -> int"
pg_exec       = "pg_exec(handle: int, sql: str) -> int"
pg_query      = "pg_query(handle: int, sql: str) -> list"
pg_query_rows = "pg_query_rows(handle: int, sql: str) -> list"
pg_last_id    = "pg_last_id(handle: int) -> int"
pg_begin      = "pg_begin(handle: int) -> bool"
pg_commit     = "pg_commit(handle: int) -> bool"
pg_rollback   = "pg_rollback(handle: int) -> bool"
pg_close      = "pg_close(handle: int) -> bool"
pg_error      = "pg_error(handle: int) -> str"

[submodules.postgres]
files = ["postgres/postgres.lph"]

[submodules.sqlite]
files = ["sqlite/sqlite.lph"]