# packages/num/package.toml
#
# `engine` is checked by `liphia install` against the running engine.
# Native packages pin the exact engine: their library uses the Rust ABI.

[package]
name        = "num"
version     = "1.0.0"
description = "Vectors, matrices and descriptive statistics over lists"
engine      = "=2.0.0"
entry       = "num.lph"
files       = ["num.lph", "composed/describe.lph", "index.lph"]

[native]
abi = "rust-1"
lib = "liphia_package_num"

[dependencies]
