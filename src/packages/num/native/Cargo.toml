[package]
name    = "liphia_package_num"
version = "1.0.0"
edition = "2021"

# Native library of the `num` package. Built as a cdylib and copied to
# packages/num/lib/ by packages/build.ps1 (or build.sh). Not a default
# member of the workspace: build it with `cargo build -p liphia_package_num --release`.
[lib]
name       = "liphia_package_num"
crate-type = ["cdylib"]

[dependencies]
liphia_virtual_machine = { path = "../../../liphia_engine/crates/liphia_virtual_machine" }
