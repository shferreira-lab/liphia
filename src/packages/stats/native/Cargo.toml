[package]
name    = "liphia_package_stats"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Native library of the `stats` package. Built as a cdylib and copied to
# packages/stats/lib/ by packages/build.ps1 (or build.sh). Not a default
# member of the workspace: build it with `cargo build -p liphia_package_stats --release`.
[lib]
name       = "liphia_package_stats"
crate-type = ["cdylib"]

[dependencies]
liphia_virtual_machine = { path = "../../../liphia_engine/crates/liphia_virtual_machine" }
