[workspace]
members = [
    "liphia_engine/crates/liphia_compiler",
    "liphia_engine/crates/liphia_virtual_machine",
    "liphia_engine/crates/liphia_bytecode",
    "liphia_engine/crates/liphia_cli",
    "liphia_engine/crates/liphia_core_native",
    "liphia_engine/crates/liphia_pipeline",
    "liphia_engine/crates/liphia_cli_gui",
    "liphia_engine/crates/liphia_gui_native",
    "liphia_engine/crates/liphia_manifest",
    "packages/db/native",
    "packages/num/native",
    "packages/stats/native",
    "packages/learn/native",
    "packages/crypto/native",
]
# Not default-members (build explicitly with -p):
#   liphia_cli_gui    — desktop GUI, pulls eframe/winit (~236 crates)
#   liphia_gui_native — only used by liphia_cli_gui
#   packages/*/native — native packages, compiled to cdylibs and dlopen'd
#                       at runtime (see liphia_virtual_machine::external).
#                       Build and copy them into packages/<name>/lib/ with
#                       packages/build.ps1 (Windows) or packages/build.sh.
default-members = [
    "liphia_engine/crates/liphia_compiler",
    "liphia_engine/crates/liphia_virtual_machine",
    "liphia_engine/crates/liphia_bytecode",
    "liphia_engine/crates/liphia_cli",
    "liphia_engine/crates/liphia_core_native",
    "liphia_engine/crates/liphia_pipeline",
    "liphia_engine/crates/liphia_manifest",
]
resolver = "2"

[profile.release]
strip     = true
opt-level = "z"
lto       = true

# Crypto is CPU-bound, so the crates behind the `crypto` package are
# optimized for speed instead of the workspace-wide "z" (size). Measured on
# 64 MiB inputs, "z" was 1.1x to 2.5x slower depending on the hash. For the
# password hashes planned for this package it also matters for security:
# the cost parameters are tuned to the speed of this code, and an attacker
# runs optimized code. A package override does not reach its dependencies,
# hence one entry per crypto crate; add new ones here as they are added.
[profile.release.package.liphia_package_crypto]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.sha3]
opt-level = 3

[profile.release.package.keccak]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3
