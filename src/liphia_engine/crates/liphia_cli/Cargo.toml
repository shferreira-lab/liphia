[package]
name    = "liphia_cli"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The executable is `liphia` (liphia.exe on Windows); the crate keeps its name.
[[bin]]
name = "liphia"
path = "src/main.rs"

[dependencies]
liphia_pipeline        = { path = "../liphia_pipeline" }
liphia_compiler        = { path = "../liphia_compiler" }
liphia_virtual_machine = { path = "../liphia_virtual_machine" }
liphia_bytecode        = { path = "../liphia_bytecode" }
liphia_core_native     = { path = "../liphia_core_native" }
liphia_manifest        = { path = "../liphia_manifest" }
