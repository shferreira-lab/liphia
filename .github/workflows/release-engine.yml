# .github/workflows/release-engine.yml
#
# Publishes the Liphia engine when a tag vX.Y.Z is pushed:
#   1. checks that the tag matches the engine version (the `version` of
#      liphia_virtual_machine, which every engine crate shares) and the
#      version of the VS Code extension (tools/liphia-vscode/package.json)
#   2. runs the workspace tests (including the conformance suite)
#   3. generates THIRD_PARTY_LICENSES.txt with cargo-about (src/about.toml)
#   4. builds `liphia` (and `liphia-gui` on Windows/macOS) per platform and
#      archives each with LICENSE.txt, THIRD_PARTY_LICENSES.txt and README.md
#   5. Windows only: builds the Inno Setup installer (installer/windows/liphia.iss)
#   6. packages the VS Code extension as liphia-vscode-X.Y.Z.vsix
#   7. creates the GitHub Release "Liphia X.Y.Z", marked as the latest release
#   8. publishes the extension to the VS Code Marketplace and Open VSX, each
#      only when its secret (VSCE_PAT / OVSX_PAT) is configured
#
#   git tag v2.1.0
#   git push origin v2.1.0

name: release-engine

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws=$(awk '/^\[package\]/{f=1; next} /^\[/{f=0} f && /^version/{gsub(/"/, "", $3); print $3}' src/liphia_engine/crates/liphia_virtual_machine/Cargo.toml | tr -d '\r')
          if [ "$tag" != "$ws" ]; then
            echo "tag v$tag does not match engine version $ws"
            exit 1
          fi

          # The extension ships with the engine, so it carries the same version
          ext=$(jq -r .version tools/liphia-vscode/package.json)
          if [ "$tag" != "$ext" ]; then
            echo "tag v$tag does not match tools/liphia-vscode/package.json version $ext"
            exit 1
          fi

          echo "version=$ws" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace --exclude liphia_cli_gui --exclude liphia_gui_native

  licenses:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate THIRD_PARTY_LICENSES.txt
        working-directory: src
        run: cargo about generate --workspace -o ../THIRD_PARTY_LICENSES.txt about.hbs
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.txt

  build:
    needs: [check, test, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x86_64, exe: ".exe", gui: true }
          - { os: ubuntu-latest,  platform: linux-x86_64,   exe: "",     gui: false }
          - { os: macos-latest,   platform: macos-aarch64,  exe: "",     gui: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: notices

      - name: Toolchain
        working-directory: src
        run: rustup show

      - name: Build CLI
        working-directory: src
        run: cargo build --release -p liphia_cli

      - name: Build GUI
        if: matrix.gui
        working-directory: src
        run: cargo build --release -p liphia_cli_gui

      # One folder per platform with the executables, licenses and README,
      # archived as .zip on Windows and .tar.gz elsewhere.
      - name: Package
        shell: bash
        run: |
          name="liphia-${{ needs.check.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp "src/target/release/liphia${{ matrix.exe }}" "dist/$name/"
          if [ "${{ matrix.gui }}" = "true" ]; then
            cp "src/target/release/liphia-gui${{ matrix.exe }}" "dist/$name/"
          fi
          cp installer/LICENSE.txt notices/THIRD_PARTY_LICENSES.txt README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          staging="$PWD/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            staging=$(cygpath -w "$staging")
          fi
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ needs.check.outputs.version }}" "/DStageDir=$env:STAGING" installer\windows\liphia.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe

  # The artifact is named engine-vscode so the release job picks it up with
  # the same engine-* pattern as the platform archives.
  vscode:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: tools/liphia-vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # vsce refuses to package without a license file; reuse the repo one
      # when the extension folder has none. vscode:prepublish (if any) runs here.
      - name: Package extension
        run: |
          if ! ls LICENSE* > /dev/null 2>&1; then
            cp ../../installer/LICENSE.txt LICENSE.txt
          fi
          mkdir -p ../../dist
          npx --yes @vscode/vsce package --out "../../dist/liphia-vscode-${{ needs.check.outputs.version }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-vscode
          path: dist/*.vsix

  release:
    needs: [check, build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: engine-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Liphia ${{ needs.check.outputs.version }}
          files: dist/*
          generate_release_notes: true
          make_latest: "true"

  # Stores are updated only after the GitHub Release exists. Each step is
  # skipped when its secret is missing; vsce reads VSCE_PAT and ovsx reads
  # OVSX_PAT from the environment.
  vscode-publish:
    needs: [check, release]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-vscode
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath "dist/liphia-vscode-${{ needs.check.outputs.version }}.vsix"

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "dist/liphia-vscode-${{ needs.check.outputs.version }}.vsix"