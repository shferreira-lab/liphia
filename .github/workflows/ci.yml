name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src -> target"

      - name: Check (core workspace)
        working-directory: src
        run: cargo check --workspace --exclude liphia_cli_gui --exclude liphia_gui_native

      - name: Test (core workspace)
        working-directory: src
        run: cargo test --workspace --exclude liphia_cli_gui --exclude liphia_gui_native

  # Packages the VS Code extension so a broken manifest or grammar fails the
  # PR instead of the release tag. The .vsix is discarded.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src/tools/liphia-vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # vsce refuses to package without a license file; reuse the repo one
      # when the extension folder has none.
      - name: Package extension
        run: |
          if ! ls LICENSE* > /dev/null 2>&1; then
            cp ../../../installer/LICENSE.txt LICENSE.txt
          fi
          npx --yes @vscode/vsce package --out /tmp/liphia-vscode-ci.vsix