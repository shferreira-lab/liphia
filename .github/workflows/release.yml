name: Release


#   git tag v0.10.0
#   git push origin v0.10.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: liphia_cli
            asset_name: liphia-linux-x86_64
          - os: macos-latest
            name: macos-x86_64
            artifact: liphia_cli
            asset_name: liphia-macos-x86_64
          - os: windows-latest
            name: windows-x86_64
            artifact: liphia_cli.exe
            asset_name: liphia-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src -> target"

      - name: Build liphia_cli (release)
        working-directory: src
        run: cargo build --release -p liphia_cli

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "src/target/release/${{ matrix.artifact }}" "dist/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact folders
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false