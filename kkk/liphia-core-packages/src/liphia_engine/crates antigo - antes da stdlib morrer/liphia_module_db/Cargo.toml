[package]
name    = "liphia_module_db"
version = "1.1.0"
edition = "2021"

# Built as a dynamic library: this is the "prebuilt" artifact that ships
# inside stdlib/modules/db/lib/ and is dlopen'd by the VM's external
# loader (liphia_virtual_machine::external) via db's index.lph manifest.
# It is intentionally NOT a dependency of liphia_cli / liphia_cli_gui —
# see stdlib/README.md and stdlib/modules/db/index.lph.
[lib]
name       = "liphia_module_db"
crate-type = ["cdylib"]

[dependencies]
liphia_virtual_machine = { path = "../liphia_virtual_machine" }
rusqlite = { version = "0.31", features = ["bundled"] }
md-5 = "0.10"